<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Hash Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>SHA-256 Hash Generator</h1>

    <textarea
        id="textInput"
        placeholder="Type any text here..."
        rows="6">
    </textarea>

    <div class="buttons">

        <button id="generateBtn">
            Generate Hash
        </button>

        <button id="copyBtn">
            Copy Hash
        </button>

        <button id="clearBtn">
            Clear
        </button>

    </div>

    <h2>Generated Hash</h2>

    <p id="hashOutput"></p>

</div>

<script src="script.js"></script>

</body>
</html>
